services:
  app:
    build:
      context: .
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_ENV: ${APP_ENV:-local}
      SESSAO_COOKIE_SECURE: "false"
      PROXY_REVERSO_CONFIAVEL: "false"
      APP_CHAVE_RATE_LIMIT: ${APP_CHAVE_RATE_LIMIT:-}
      ADMIN_BOOTSTRAP_HABILITADO: ${ADMIN_BOOTSTRAP_HABILITADO:-false}
      ADMIN_INICIAL_NOME: ${ADMIN_INICIAL_NOME:-}
      ADMIN_INICIAL_EMAIL: ${ADMIN_INICIAL_EMAIL:-}
      ADMIN_INICIAL_SENHA: ${ADMIN_INICIAL_SENHA:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql_data:

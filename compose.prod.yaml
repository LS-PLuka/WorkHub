services:
  app:
    build:
      context: .
    environment:
      DB_HOST: ${DB_HOST:?Defina DB_HOST no .env}
      DB_PORT: ${DB_PORT:?Defina DB_PORT no .env}
      DB_NAME: ${DB_NAME:?Defina DB_NAME no .env}
      DB_USER: ${DB_USER:?Defina DB_USER no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      APP_ENV: production
      SESSAO_COOKIE_SECURE: "true"
      PROXY_REVERSO_CONFIAVEL: "true"
      APP_CHAVE_RATE_LIMIT: ${APP_CHAVE_RATE_LIMIT:?Defina APP_CHAVE_RATE_LIMIT no .env}
      ADMIN_BOOTSTRAP_HABILITADO: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m

  db:
    image: mysql:8.4
    command: --innodb-buffer-pool-size=256M --max-connections=80
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE no .env}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 768m

  caddy:
    image: caddy:2.8-alpine
    environment:
      WORKHUB_DOMINIO: ${WORKHUB_DOMINIO:?Defina WORKHUB_DOMINIO no .env}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    mem_limit: 128m

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

name: workhub-demo

services:
  app:
    build:
      context: .
    ports:
      - "80:80"
    environment:
      DB_HOST: ${DB_HOST:?Defina DB_HOST no arquivo .env.demo}
      DB_PORT: ${DB_PORT:?Defina DB_PORT no arquivo .env.demo}
      DB_NAME: ${DB_NAME:?Defina DB_NAME no arquivo .env.demo}
      DB_USER: ${DB_USER:?Defina DB_USER no arquivo .env.demo}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env.demo}
      APP_ENV: demo
      SESSAO_COOKIE_SECURE: "false"
      PROXY_REVERSO_CONFIAVEL: "false"
      APP_CHAVE_RATE_LIMIT: ${APP_CHAVE_RATE_LIMIT:?Defina APP_CHAVE_RATE_LIMIT no arquivo .env.demo}
      ADMIN_BOOTSTRAP_HABILITADO: "false"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m

  db:
    image: mysql:8.4
    command: --innodb-buffer-pool-size=256M --max-connections=80
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE no arquivo .env.demo}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no arquivo .env.demo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no arquivo .env.demo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env.demo}
    volumes:
      - mysql_demo_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 768m

volumes:
  mysql_demo_data:
